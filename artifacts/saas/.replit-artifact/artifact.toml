kind = "web"
previewPath = "/saas/"
title = "AlgoEdge SaaS Platform"
version = "1.0.0"
id = "artifacts/saas"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/saas/" ]
localPort = 19834

[services.development]
run = "pnpm --filter @workspace/saas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saas", "run", "build" ]
publicDir = "artifacts/saas/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19834"
BASE_PATH = "/saas/"

# ── System B API ──────────────────────────────────────────────────────────────
# SaaS-specific backend routes (saas_router.py), served by the same FastAPI
# process as the private trading-api but under a completely separate prefix.
[[services]]
name = "saas-api"
paths = [ "/saas-api" ]
localPort = 8099

[services.development]
run = "cd /home/runner/workspace/trading-platform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8099 --reload"

[services.production]

[services.production.run]
args = ["bash", "-c", "cd trading-platform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8099 --workers 1"]

[services.production.run.env]
API_PREFIX = "/trading-api"

[services.production.health.startup]
path = "/saas-api/health"

[services.env]
PORT = "8099"
API_PREFIX = "/trading-api"
