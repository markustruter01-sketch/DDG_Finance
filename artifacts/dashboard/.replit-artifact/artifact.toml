kind = "web"
previewPath = "/"
title = "Trading Platform Dashboard"
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23183

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
publicDir = "artifacts/dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23183"
BASE_PATH = "/"

[[services]]
name = "trading-api"
paths = [ "/trading-api" ]
localPort = 8000

[services.development]
run = "cd /home/runner/workspace/trading-platform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

[services.production]

[services.production.run]
args = ["bash", "-c", "cd trading-platform && python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"]

[services.production.run.env]
API_PREFIX = "/trading-api"

[services.production.health.startup]
path = "/trading-api/health"

[services.env]
PORT = "8000"
API_PREFIX = "/trading-api"

[[services]]
name = "kraken-bot"
paths = [ "/kraken-bot" ]
localPort = 8085

[services.development]
run = "cd /home/runner/workspace && BOT_ID=bot2_spy_qqq python3 kraken-bot/main.py"

[services.production]

[services.production.run]
args = ["bash", "-c", "BOT_ID=bot2_spy_qqq python3 kraken-bot/main.py"]

[services.env]
PORT = "8085"
BOT_ID = "bot2_spy_qqq"

